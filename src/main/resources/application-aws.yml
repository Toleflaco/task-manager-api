spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    mongodb:
      uri: mongodb+srv://taskmanager_app:${MONGODB_PASSWORD}@task-manager-cluster.dgu0fym.mongodb.net/taskmanager?retryWrites=true&w=majority&appName=task-manager-cluster
      database: taskmanager
      auto-index-creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 60m

aws:
  s3:
    bucket: toleflaco-task-manager-uploads-2026

logging:
  level:
    root: INFO
    org.flywaydb: INFO
    software.amazon.awssdk: INFO

management:
  health:
    mongodb:
      enabled: false

server:
  port: 8080
