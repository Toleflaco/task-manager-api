server:
  port: 8081

spring:
  application:
    name: task-manager-api
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
jwt:
  secret: ${JWT_SECRET:}
  # Dev values: short for testing the full refresh cycle in one session
  # Production values: 15m access / 7d refresh (RFC 6749 standard)
  access-expiration: 1m
  refresh-expiration: 5m
rate-limit:
  # Login: 5 attempts allowed in burst, then 1 attempt per minute regenerated.
  # Production might tighten to 3 capacity / 5m refill depending on attack pattern.
  login:
    capacity: 5
    refill-period: 1m
