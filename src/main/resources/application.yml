server:
  port: 8081

spring:
  application:
    name: task-manager-api
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
jwt:
  secret: ${JWT_SECRET:}
  # Dev values: short for testing the full refresh cycle in one session
  # Production values: 15m access / 7d refresh (RFC 6749 standard)
  access-expiration: 1m
  refresh-expiration: 5m